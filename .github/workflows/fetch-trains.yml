name: Fetch train data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install httpx

      - name: Fetch data from Yandex Rasp
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
        run: python ./.github/scripts/fetch_data.py

      - name: Upload updated data.json via GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: main
        run: |
          curl -L \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/data.json \
            -d "{
              \"message\": \"Update train data\",
              \"content\": \"\$(base64 data.json | tr -d '\n')\",
              \"branch\": \"${BRANCH}\"
            }"


