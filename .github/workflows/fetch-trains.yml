name: Fetch train data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Критически важно для git push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install httpx

      - name: Fetch data from Yandex Rasp
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
        run: python ./.github/scripts/fetch_data.py

      # Вместо сложного curl — простой коммит
      - name: Commit and push data.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Проверяем, изменился ли файл
          if ! git diff --exit-code HEAD -- data.json > /dev/null; then
            echo "Changes detected. Committing and pushing..."
            git add data.json
            git commit -m "Update train data"
            git push
          else
            echo "No changes in data.json. Skipping commit."
          fi
